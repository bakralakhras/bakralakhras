<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1A2B4A"/>
      <stop offset="1" stop-color="#070C17"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB6A"/>
      <stop offset="1" stop-color="#B9822B"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12213B"/>
      <stop offset="1" stop-color="#0A1426"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2A4066" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- shield -->
  <path d="M256 70 L398 118 V250 C398 344 334 404 256 442 C178 404 114 344 114 250 V118 Z"
        fill="url(#fill)" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M256 96 L374 136 V250 C374 330 320 382 256 414 C192 382 138 330 138 250 V136 Z"
        fill="none" stroke="#F5CB6A" stroke-opacity=".25" stroke-width="2"/>
  <!-- node mesh -->
  <g stroke="#4FE3D1" stroke-width="5" stroke-linecap="round" opacity=".9">
    <line x1="256" y1="252" x2="256" y2="160"/>
    <line x1="256" y1="252" x2="336" y2="206"/>
    <line x1="256" y1="252" x2="336" y2="298"/>
    <line x1="256" y1="252" x2="256" y2="350"/>
    <line x1="256" y1="252" x2="176" y2="298"/>
    <line x1="256" y1="252" x2="176" y2="206"/>
  </g>
  <g stroke="#4FE3D1" stroke-width="3" stroke-opacity=".45" fill="none">
    <path d="M256 160 L336 206 L336 298 L256 350 L176 298 L176 206 Z"/>
  </g>
  <g fill="#0A1426" stroke="#4FE3D1" stroke-width="6" filter="url(#glow)">
    <circle cx="256" cy="160" r="15"/>
    <circle cx="336" cy="206" r="15"/>
    <circle cx="336" cy="298" r="15"/>
    <circle cx="256" cy="350" r="15"/>
    <circle cx="176" cy="298" r="15"/>
    <circle cx="176" cy="206" r="15"/>
  </g>
  <circle cx="256" cy="252" r="26" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="256" cy="252" r="11" fill="#0A1426"/>
</svg>
